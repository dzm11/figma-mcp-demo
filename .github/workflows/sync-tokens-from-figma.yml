name: Sync tokens from Figma

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: Commit message for synced token changes
        required: false
        default: "chore: sync tokens from figma"
      file_key:
        description: Optional Figma file key override (uses secret FIGMA_FILE_KEY when empty)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
      FIGMA_FILE_KEY: ${{ github.event.inputs.file_key != '' && github.event.inputs.file_key || secrets.FIGMA_FILE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required Figma secrets
        run: |
          if [ -z "${{ secrets.FIGMA_TOKEN }}" ]; then
            echo "Missing repository secret: FIGMA_TOKEN"
            exit 1
          fi
          if [ -z "$FIGMA_FILE_KEY" ]; then
            echo "Missing repository secret: FIGMA_FILE_KEY"
            exit 1
          fi

      - name: Sync tokens (pull + build)
        id: sync_tokens
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run tokens:sync

      - name: Show changed tokens summary
        if: steps.sync_tokens.outcome == 'success'
        run: |
          TARGET_FILES="tokens/tokens.source.json src/styles/tokens.css src/styles/typography.css"

          echo "Changed files:"
          CHANGED_FILES=$(git diff --name-only -- $TARGET_FILES)

          if [ -z "$CHANGED_FILES" ]; then
            echo "- none"
            {
              echo "## Token sync summary"
              echo
              echo "No token changes were produced by this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$CHANGED_FILES" | sed 's/^/- /'

          CSS_VAR_CHANGES=$(git diff -U0 -- src/styles/tokens.css src/styles/typography.css \
            | grep -E '^[+-][[:space:]]*--[a-z0-9-]+:' || true)

          FIGMA_NAME_CHANGES=$(git diff -U0 -- tokens/tokens.source.json \
            | grep -E '^[+-][[:space:]]*"name"[[:space:]]*:' || true)

          {
            echo "## Token sync summary"
            echo
            echo "### Changed files"
            echo "$CHANGED_FILES" | sed 's/^/- /'
            echo
            echo "### Changed CSS variables"
            if [ -n "$CSS_VAR_CHANGES" ]; then
              echo '```diff'
              echo "$CSS_VAR_CHANGES"
              echo '```'
            else
              echo "No CSS variable value changes detected."
            fi
            echo
            echo "### Changed token names in source JSON"
            if [ -n "$FIGMA_NAME_CHANGES" ]; then
              echo '```diff'
              echo "$FIGMA_NAME_CHANGES"
              echo '```'
            else
              echo "No token name changes detected in source JSON."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit synced files
        if: steps.sync_tokens.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tokens/tokens.source.json src/styles/tokens.css src/styles/typography.css

          if git diff --cached --quiet; then
            echo "No token changes to commit."
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push
            echo "Token changes committed and pushed."
          fi
