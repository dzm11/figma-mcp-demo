name: Build design tokens

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Commit message for the generated files"
        required: false
        default: "chore: rebuild generated token files"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build token files
        run: npm run tokens:build

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/styles/tokens.css src/styles/typography.css
          if git diff --cached --quiet; then
            echo "No changes to commit — generated files are already up to date."
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push
            echo "Changes committed and pushed."
          fi
