name: Sync icons from Figma

on:
  workflow_dispatch:
    inputs:
      file_key:
        description: Optional Figma file key override (uses secret FIGMA_FILE_KEY when empty)
        required: false
        default: ""

  # Triggered via Figma webhook / library publish automation.
  # POST to the repo's /dispatches endpoint with:
  #   { "event_type": "figma-library-publish" }
  repository_dispatch:
    types:
      - figma-library-publish

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
      FIGMA_FILE_KEY: ${{ github.event.inputs.file_key != '' && github.event.inputs.file_key || secrets.FIGMA_FILE_KEY }}
      BASE_BRANCH: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Needed so the script can create a new branch and push
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required Figma secrets
        run: |
          if [ -z "${{ secrets.FIGMA_TOKEN }}" ]; then
            echo "Missing repository secret: FIGMA_TOKEN"
            exit 1
          fi
          if [ -z "$FIGMA_FILE_KEY" ]; then
            echo "Missing repository secret: FIGMA_FILE_KEY (or file_key input)"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync icons and create PR
        id: sync_icons
        run: npm run icons:pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Icon sync summary"
            echo
            if [ "${{ steps.sync_icons.outcome }}" = "success" ]; then
              echo "✅ Icon sync completed successfully."
              echo
              echo "Check the Pull Requests tab for a new \`chore/icons-sync-*\` branch,"
              echo "or confirm there were no changes if no PR was opened."
            else
              echo "❌ Icon sync failed. Check the step logs above for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
